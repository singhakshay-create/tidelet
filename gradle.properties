# Project-wide Gradle settings.
# These affect *how* Gradle builds — not what's in the app.

# Give the Gradle daemon enough memory to compile a Compose app comfortably.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is the modern (post-support-library) Android libraries namespace.
android.useAndroidX=true

# Use Kotlin's official code style.
kotlin.code.style=official

# Only include the ABI-specific resources we ship (keeps APK size down).
android.nonTransitiveRClass=true

# Run tasks in parallel where safe.
org.gradle.parallel=true

# Cache task outputs to speed up incremental builds.
org.gradle.caching=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
