# Release: builds a signed release APK and publishes it as a GitHub Release
# whenever a version tag (e.g. v1.0.0) is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # "permissions" scopes what this workflow's temporary token can do against the repo;
    # contents: write is required so the job can create a GitHub Release.
    permissions:
      contents: write
    steps:
      # Pinning to an exact commit SHA means this workflow always runs the same,
      # reviewed action code instead of whatever a mutable tag happens to point to later.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      # A GitHub secret is an encrypted value stored in the repo/org settings and injected
      # here at run time — it's never visible in logs or to people without access.
      # We decode it straight to a file under $RUNNER_TEMP (a per-run scratch directory
      # GitHub Actions wipes after the job), and never print its contents.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TIDELET_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          TIDELET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TIDELET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TIDELET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK and compute checksum
        run: |
          cd app/build/outputs/apk/release
          APK_SRC=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          APK_NAME="Tidelet-${{ github.ref_name }}.apk"
          mv "$APK_SRC" "$APK_NAME"
          # Checksum the bare filename (not the full path) so `sha256sum -c` still
          # works after someone downloads just the .apk and .sha256 into one folder.
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "APK_PATH=$PWD/$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_SHA256_PATH=$PWD/$APK_NAME.sha256" >> "$GITHUB_ENV"

      # An "artifact"/release asset here is a file attached to the GitHub Release so
      # people can download it directly from the repo's Releases page.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          prerelease: true
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_SHA256_PATH }}
