# CI: builds and tests every push and pull request, so problems are caught before merge.
name: CI

# A "trigger" tells GitHub Actions when to run this workflow automatically.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Pinning an action to an exact commit SHA (not a mutable tag like "@v4") means the
      # workflow always runs the same, reviewed code — a tag can be moved to point at
      # different code later, a SHA can't.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies/build output between runs and validates the wrapper JAR.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      # Uses this repo's own committed Gradle wrapper (./gradlew), not a separately installed Gradle.
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug test --no-daemon
